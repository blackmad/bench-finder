repos:
  # # Ruff for linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        pass_filenames: true
      # Run the formatter
      - id: ruff-format
        pass_filenames: true

  # Additional useful hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      # - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  # Strip Jupyter notebook outputs
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: \.ipynb$



  # Type checking with mypy
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.18.2
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [
  #         types-requests>=2.32.4.20250913,
  #         mypy-extensions>=1.1.0,
  #         types-python-dateutil>=2.9.0.20241016,
  #       ]
  #       args: [
  #         --config-file=pyproject.toml,
  #         --show-error-codes,
  #         --namespace-packages,
  #       ]
  #       exclude: ^(tests/|examples/|venv/|frontend/|bin/|tools/)
  #       pass_filenames: true

  # Local hooks for frontend
  - repo: local
    hooks:
      # Biome check for linting and formatting (with auto-fix)
      - id: biome-check
        name: Biome check (auto-fix)
        entry: bash -c 'cd frontend && npm run check:fix'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|json)$
        pass_filenames: false
        always_run: false

      # TypeScript type checking and Vite build
      - id: typescript-build
        name: TypeScript build check
        entry: bash -c 'cd frontend && npm run build'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
        always_run: false
