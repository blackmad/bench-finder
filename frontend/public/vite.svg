<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Bench design - simple and recognizable at small sizes -->

  <!-- Bench backrest -->
  <rect x="6" y="8" width="20" height="2.5" rx="1" fill="#6366f1"/>
  <rect x="7" y="10.5" width="1.5" height="4" fill="#6366f1"/>
  <rect x="13" y="10.5" width="1.5" height="4" fill="#6366f1"/>
  <rect x="19" y="10.5" width="1.5" height="4" fill="#6366f1"/>
  <rect x="25" y="10.5" width="1.5" height="4" fill="#6366f1"/>

  <!-- Bench seat -->
  <rect x="6" y="16" width="20" height="3" rx="1" fill="#818cf8"/>

  <!-- Left leg with support -->
  <rect x="8" y="16" width="2" height="8" fill="#4f46e5"/>
  <rect x="6" y="22" width="6" height="2" rx="0.5" fill="#4f46e5"/>

  <!-- Right leg with support -->
  <rect x="22" y="16" width="2" height="8" fill="#4f46e5"/>
  <rect x="20" y="22" width="6" height="2" rx="0.5" fill="#4f46e5"/>

  <!-- Center support -->
  <rect x="15" y="16" width="2" height="8" fill="#4f46e5"/>
</svg>
