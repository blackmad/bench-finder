    "ruff>=0.14.2",
    "pre-commit>=4.0.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "black>=24.0.0",  # Keep as backup formatter
    "isort>=5.13.0",  # Keep as backup import sorter
]
types = [
    "types-requests>=2.32.4.20250913",
    "mypy-extensions>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/your-org/bench-finder"
Repository = "https://github.com/your-org/bench-finder"
Documentation = "https://github.com/your-org/bench-finder/blob/main/docs/README.md"
"Bug Tracker" = "https://github.com/your-org/bench-finder/issues"

[project.scripts]
bench-finder = "bench_finder.cli:main"
bench-detection = "tools.bench_detection_cli:main"
unified-bench-search = "tools.unified_bench_search_cli:main"

# Dependency overrides to force specific versions
[tool.uv]
override-dependencies = [
    "pillow>=9.11",
]

[tool.hatch.build.targets.wheel]
packages = ["bench_finder", "api", "tools", "examples"]

[tool.hatch.build.targets.sdist]
include = [
    "/bench_finder",
    "/api",
    "/tools",
    "/examples",
    "/docs",
    "/tests",
    "/pyproject.toml",
    "/README.md",
]

# Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused-function-args
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PIE", # flake8-pie
    "A", # flake8-builtins
    "COM", # flake8-commas
    "C90", # mccabe
    "ICN", # flake8-import-conventions
    "G", # flake8-logging-format
    "INP", # flake8-no-pep420
    # "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD", # pandas-vet
    "PGH", # pygrep-hooks
    "PL", # pylint
    "TRY", # tryceratops
    "FLY", # flynt
    "NPY", # numpy
    "AIR", # airflow
    "PERF", # perflint
    "FURB", # refurb
    "RUF", # ruff-specific rules

]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "B006", # do not use mutable data structures for argument defaults
    "PLR0913", # too many arguments to function call
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR0911", # too many retrn statements
    "PLR2004", # magic value used in comparison
    "TRY003", # avoid specifying long messages outside the exception class
    "COM812", # missing trailing comma
    "ISC001", # implicitly concatenated string literals
    "Q000", # single quotes found but double quotes preferred
    "Q001", # single quote multiline found but double quotes preferred
    "Q002", # single quote docstring found but double quotes preferred
    "Q003", # change outer quotes to avoid escaping inner quotes
    "G004", # logging-format: logging statement uses f-string,
    "PERF203", # try in loop
    "TRY300", # consider moving to an else block
    "TRY301", # raise to an inner function,
    "C901", # too complex
    "ERA001", # commented out code,
    "TRY002", # create your own exception,
    "PLC0415", # import must be at top of file - sometimes it's for perf
    "RUF001", # ambiguous i
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = [
    "PLR2004", # Allow magic values in tests
    "S101", # Allow assert statements in tests
    "ARG", # Allow unused function arguments in tests
    "FBT", # Allow boolean positional arguments in tests
]
"examples/**/*.py" = [
    "PLR2004", # Allow magic values in examples
    "T201", # Allow print statements in examples
    "ARG", # Allow unused function arguments in examples
]
"tools/**/*.py" = [
    "PLR2004", # Allow magic values in tools
    "T201", # Allow print statements in tools
    "ARG", # Allow unused function arguments in tools
]

[tool.ruff.isort]
known-first-party = ["bench_finder", "api", "tools", "examples"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.pylint]
max-args = 10
max-branches = 12
max-returns = 6
max-statements = 50

# Ruff format configuration
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=bench_finder",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["bench_finder", "api", "tools"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# MyPy configuration (kept for type checking, but ruff will handle most linting)
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

