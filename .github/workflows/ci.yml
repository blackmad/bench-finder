name: CI

on:
  push:
    branches: [main, resurrect]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check bench_finder/migrate.py bench_finder/quarantine.py bench_finder/facing.py bench_finder/publish bench_finder/labeling bench_finder/clients/view_classifier.py tests
      - run: uv run pytest -q

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json
      # The frontend's typed client imports the Worker's AppType, so tsc needs worker deps.
      - run: npm ci
        working-directory: worker
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_DATA_BASE_URL: ${{ vars.VITE_DATA_BASE_URL }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_GOOGLE_MAPS_EMBED_KEY: ${{ vars.VITE_GOOGLE_MAPS_EMBED_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # Every push deploys a Pages preview (branch alias URL); main is production.
  # Skipped until the owner adds CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (task 4.1).
  deploy-site:
    if: github.event_name == 'push'
    needs: [frontend, worker]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          name: frontend-dist
          path: frontend/dist
      # Static-assets Worker (frontend/wrangler.jsonc). main goes live; other
      # branches upload a version with its own preview URL without promoting it.
      - if: env.CLOUDFLARE_API_TOKEN != '' && github.ref == 'refs/heads/main'
        working-directory: frontend
        run: npx --yes wrangler@4 deploy
      - if: env.CLOUDFLARE_API_TOKEN != '' && github.ref != 'refs/heads/main'
        working-directory: frontend
        run: npx --yes wrangler@4 versions upload --preview-alias "$(echo "${GITHUB_REF_NAME}" | tr -c 'a-zA-Z0-9-' '-' | cut -c1-40)"

  deploy-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [worker, python]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 24
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npx wrangler d1 migrations apply bench-finder --remote && npx wrangler deploy
